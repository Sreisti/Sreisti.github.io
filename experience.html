  <main class="container">
    <section>
      <h1><span class="section-index">02</span>Experience</h1>
      <p style="color: var(--ink-soft); max-width: 60ch;">
        Club, work, volunteer and research experience, color-coded by type. Use the
        filters below to narrow it down. The bar on each entry shows how long it lasted.
      </p>

      <div class="exp-toolbar">
        <div class="chip-group">
          <span class="group-label">Type</span>
          <div id="categoryChips" style="display: contents;"></div>
        </div>
        <div class="chip-group">
          <span class="group-label">Context</span>
          <div id="contextChips" style="display: contents;"></div>
        </div>
      </div>

      <div class="timeline" id="timeline"></div>
    </section>

  <footer class="site-footer">
    <div class="footer-links" id="footerLinks"></div>
